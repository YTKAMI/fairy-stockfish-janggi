name: Build Janggi Android APK
on:
  workflow_dispatch:
  push:
    branches: [ android-apk-build ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build ARM64 Fairy-Stockfish Janggi engine
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets
          git clone --depth 1 https://github.com/fairy-stockfish/Fairy-Stockfish.git engine-src
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -C engine-src/src -j2 build ARCH=armv8 COMP=ndk OS=Android largeboards=yes
          install -m 755 engine-src/src/stockfish app/src/main/assets/fairy-stockfish
          echo "NNUE is supplied separately; building a diagnostic APK without network guessing."
          ls -lh app/src/main/assets
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JanggiNative-Android-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
