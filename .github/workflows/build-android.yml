name: Build Janggi Android APK
on:
  workflow_dispatch:
  push:
    branches: [ android-apk-build ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build ARM64 Fairy-Stockfish Janggi engine
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/fairy-stockfish/Fairy-Stockfish.git engine-src
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -C engine-src/src -j2 build ARCH=armv8 COMP=ndk OS=Android largeboards=yes
          install -m 755 engine-src/src/stockfish app/src/main/assets/fairy-stockfish
          release_json="$(curl -fsSL https://api.github.com/repos/fairy-stockfish/Fairy-Stockfish-NNUE/releases/tags/janggi-9991472750de-new)"
          nnue_url="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith(".nnue") and "janggi-9991472750de" in a["name"]))' <<< "$release_json")"
          test -n "$nnue_url"
          curl -fL "$nnue_url" -o app/src/main/assets/janggi-9991472750de.nnue
          chmod 644 app/src/main/assets/janggi-9991472750de.nnue
          ls -lh app/src/main/assets
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JanggiNative-Android-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
