name: Build Janggi Android APK
on:
  workflow_dispatch:
  push:
    branches: [ android-apk-build ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Build ARM64 Fairy-Stockfish with embedded Janggi NNUE
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          git clone --depth 1 --recurse-submodules https://github.com/fairy-stockfish/Fairy-Stockfish-NNUE.git engine-src
          NNUE_NET="janggi-9991472750de.nnue"
          test -s "engine-src/$NNUE_NET"
          cp "engine-src/$NNUE_NET" engine-src/Fairy-Stockfish/src/
          sed -i "s/nn-[a-z0-9]\\{12\\}.nnue/$NNUE_NET/" engine-src/Fairy-Stockfish/src/evaluate.h
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -C engine-src/Fairy-Stockfish/src clean EXE=fairy-stockfish
          make -C engine-src/Fairy-Stockfish/src -j2 build EXE=fairy-stockfish ARCH=armv8 COMP=ndk OS=Android largeboards=yes nnue=yes load_net=
          install -m 755 engine-src/Fairy-Stockfish/src/fairy-stockfish app/src/main/jniLibs/arm64-v8a/libfairy-stockfish.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libfairy-stockfish.so
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JanggiNative-Android-ARM64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
