name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'launcher.py'
      - 'janggi_server.py'
      - '장기엔진판.html'
      - 'data_factory.html'
      - 'fairy-stockfish_x86-64-avx512.exe'
      - 'janggi_settings.json'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download CPU-compatible Janggi engine
        shell: pwsh
        run: |
          # Generic x86-64 build: broadest CPU compatibility; includes Janggi NNUE.
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/fairy-stockfish/Fairy-Stockfish-NNUE/releases/tags/janggi-9991472750de-new'
          $asset = $release.assets | Where-Object { $_.name -eq 'fairy-stockfish_x86-64.exe' } | Select-Object -First 1
          if (-not $asset) { throw 'Compatible Fairy-Stockfish Janggi engine asset not found.' }
          if (Test-Path 'fairy-stockfish_x86-64-avx512.exe') { Remove-Item 'fairy-stockfish_x86-64-avx512.exe' -Force }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'fairy-stockfish_x86-64.exe'
          if ((Get-Item 'fairy-stockfish_x86-64.exe').Length -lt 1000000) { throw 'Downloaded engine file is unexpectedly small.' }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller==6.17.0
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name JanggiEngine `
            --add-data "장기엔진판.html;." `
            --add-data "data_factory.html;." `
            --add-binary "fairy-stockfish_x86-64.exe;." `
            --add-data "janggi_settings.json;." `
            launcher.py
          if (!(Test-Path 'dist/JanggiEngine/JanggiEngine.exe')) { throw 'EXE build failed' }
          if (!(Test-Path 'data_factory.html')) { throw 'data_factory.html is missing; upload the original data factory HTML first.' }
          Copy-Item '장기엔진판.html' 'dist/JanggiEngine/장기엔진판.html' -Force
          Copy-Item 'data_factory.html' 'dist/JanggiEngine/data_factory.html' -Force
          Copy-Item 'fairy-stockfish_x86-64.exe' 'dist/JanggiEngine/fairy-stockfish_x86-64.exe' -Force
          Copy-Item 'janggi_settings.json' 'dist/JanggiEngine/janggi_settings.json' -Force
      - name: Package portable folder
        shell: pwsh
        run: Compress-Archive -Path 'dist/JanggiEngine/*' -DestinationPath 'JanggiEngine-Windows.zip' -Force
      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: JanggiEngine-Windows
          path: JanggiEngine-Windows.zip
          if-no-files-found: error
